name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PORT: "10000"
      JWTSECRET: "ci-only-jwt-secret-replace-in-production-0123456789"
      APP_BASE_URL: "http://127.0.0.1:10000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      MONGODB_URI: "mongodb://127.0.0.1:27017"
      DB_NAME: "gordian_ci"
      TRUST_PROXY: "false"
      DEBUG: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Unit and handler tests
        run: make test

      - name: Integration tests
        run: make itest

      - name: Vulnerability scan
        run: make vuln

      - name: Build
        run: make build

      - name: Start server
        run: |
          ./main > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/v1/health >/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy"
          cat server.log
          exit 1

      - name: Health check smoke test
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10000/api/v1/health)
          if [ "$status" != "200" ]; then
            echo "Health check returned $status"
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
