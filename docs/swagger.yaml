basePath: /api/v1
definitions:
  data.FetchUserByIDRequest:
    properties:
      user_id:
        example: 615f2e0a6c6d5c0e1a1e4a01
        type: string
    required:
    - user_id
    type: object
  data.HealthResponse:
    properties:
      details:
        additionalProperties: {}
        type: object
      status:
        type: string
    type: object
  data.LoginRegisterResponse:
    properties:
      message:
        type: string
      tokens:
        $ref: '#/definitions/data.SessionTokens'
      user:
        $ref: '#/definitions/data.User'
    type: object
  data.LoginRequest:
    properties:
      identifier:
        example: johndoe
        maxLength: 254
        type: string
      password:
        example: P@ssw0rd!
        maxLength: 128
        type: string
    required:
    - identifier
    - password
    type: object
  data.MessageResponse:
    properties:
      message:
        type: string
    type: object
  data.PasswordResetConfirmRequest:
    properties:
      new_password:
        example: NewP@ssw0rd!
        type: string
      token:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - new_password
    - token
    type: object
  data.PasswordResetInitiateRequest:
    properties:
      email:
        example: john@example.com
        maxLength: 254
        type: string
    required:
    - email
    type: object
  data.PublicProfile:
    properties:
      date_joined:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      profile_picture:
        type: string
      username:
        type: string
    type: object
  data.PublicProfileResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/data.PublicProfile'
    type: object
  data.PublicUser:
    properties:
      birthdate:
        type: string
      date_joined:
        type: string
      email_confirmed:
        type: boolean
      first_name:
        type: string
      last_name:
        type: string
      profile_picture:
        type: string
      username:
        type: string
    type: object
  data.RegisterRequest:
    properties:
      accept_terms:
        example: true
        type: boolean
      birthdate:
        example: "1990-01-01T00:00:00Z"
        type: string
      email:
        example: john@example.com
        maxLength: 254
        type: string
      first_name:
        example: John
        maxLength: 50
        minLength: 2
        type: string
      last_name:
        example: Doe
        maxLength: 50
        minLength: 2
        type: string
      password:
        example: P@ssw0rd!
        type: string
      profile_picture:
        example: data:image/png;base64,iVBORw0...
        type: string
      username:
        example: johndoe
        maxLength: 20
        minLength: 5
        type: string
    required:
    - accept_terms
    - birthdate
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  data.ResendConfirmationRequest:
    properties:
      email:
        example: john@example.com
        maxLength: 254
        type: string
    required:
    - email
    type: object
  data.SessionTokens:
    properties:
      access_created_at:
        type: string
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_created_at:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  data.TokenResponse:
    properties:
      message:
        type: string
      tokens:
        $ref: '#/definitions/data.SessionTokens'
    type: object
  data.UpdateRequest:
    properties:
      birthdate:
        example: "1990-01-01T00:00:00Z"
        type: string
      current_password:
        example: OldP@ssw0rd!
        maxLength: 128
        type: string
      email:
        example: john@example.com
        maxLength: 254
        type: string
      first_name:
        example: John
        maxLength: 50
        minLength: 2
        type: string
      last_name:
        example: Doe
        maxLength: 50
        minLength: 2
        type: string
      password:
        example: NewP@ssw0rd!
        type: string
      profile_picture:
        example: data:image/png;base64,iVBORw0...
        type: string
      username:
        example: johndoe
        maxLength: 20
        minLength: 5
        type: string
    type: object
  data.User:
    properties:
      accept_terms:
        type: boolean
      birthdate:
        type: string
      date_joined:
        type: string
      email:
        type: string
      email_confirmed:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      profile_picture:
        type: string
      username:
        type: string
    type: object
  data.UserResponse:
    properties:
      message:
        type: string
      tokens:
        $ref: '#/definitions/data.SessionTokens'
      user:
        $ref: '#/definitions/data.PublicUser'
    type: object
  data.ValidationErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
info:
  contact: {}
  description: Authentication and user management REST API for Gordian
  title: Gordian API
  version: "1.0"
paths:
  /confirm-email/{token}:
    get:
      description: Confirms an email address using the token sent by email and renders
        a confirmation page.
      parameters:
      - description: Confirmation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with success message
          schema:
            type: string
        "400":
          description: HTML page with failure message
          schema:
            type: string
        "500":
          description: HTML page with failure message
          schema:
            type: string
      summary: Confirm email address
      tags:
      - Auth
  /delete:
    delete:
      description: Permanently deletes the authenticated user's account.
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted successfully
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: Account not found or already deleted
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - Users
  /fetchuser:
    get:
      description: Retrieves the authenticated user's profile.
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            $ref: '#/definitions/data.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: User profile not found
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Fetch current user
      tags:
      - Users
  /fetchuserbyid:
    post:
      consumes:
      - application/json
      description: Retrieves a limited public profile by user ID. Birthdate, email
        and confirmation state are never returned.
      parameters:
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.FetchUserByIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User fetched successfully
          schema:
            $ref: '#/definitions/data.PublicProfileResponse'
        "400":
          description: Validation error or invalid user ID format
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: The specified user could not be found
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Fetch user by ID
      tags:
      - Users
  /health:
    get:
      description: Returns service health status and details.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/data.HealthResponse'
        "503":
          description: Service health check failed
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Service health check
      tags:
      - Health
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates with username/email and password. Invalid identifiers
        and passwords return the same response.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/data.LoginRegisterResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "403":
          description: Email not confirmed
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "429":
          description: Too many failed login attempts
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Login to the application
      tags:
      - Auth
  /logout:
    post:
      description: Revokes all access and refresh tokens for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - Auth
  /password-reset/confirm:
    post:
      consumes:
      - application/json
      description: Sets a new password using a single-use reset token. All existing
        sessions are revoked.
      parameters:
      - description: Password reset confirm request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.PasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "400":
          description: Validation error or invalid/expired reset token
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Confirm password reset
      tags:
      - Auth
  /password-reset/initiate:
    post:
      consumes:
      - application/json
      description: Sends a password reset token if the account exists. The response
        is identical for unknown addresses so accounts cannot be enumerated.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.PasswordResetInitiateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If an account exists with this email, a reset link will be
            sent
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "429":
          description: Too many password reset requests
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Initiate password reset
      tags:
      - Auth
  /refresh:
    get:
      description: Exchanges a valid refresh token for a new token pair. Deleted users,
        revoked sessions and unconfirmed email addresses are rejected.
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
          schema:
            $ref: '#/definitions/data.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "403":
          description: Email not confirmed
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Refresh authentication tokens
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new account and sends an email confirmation link. If
        email delivery fails the account is still created; use the resend endpoint.
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "409":
          description: Username or email is already registered
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "429":
          description: Too many registration attempts
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Register a new user
      tags:
      - Auth
  /resend-confirmation-email:
    get:
      description: Resends the email confirmation to the authenticated user. Prefer
        the unauthenticated POST variant when login is blocked.
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation email sent successfully
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: User profile not found
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "409":
          description: Email is already confirmed
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "429":
          description: Too many confirmation email requests
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Unable to resend confirmation email
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Resend confirmation email (authenticated)
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Sends a new confirmation email when an unconfirmed account exists.
        Always returns the same response.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.ResendConfirmationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If an account exists and is unconfirmed, an email will be sent
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      summary: Resend confirmation email by address
      tags:
      - Auth
  /update:
    patch:
      consumes:
      - application/json
      description: Updates the authenticated user's profile. Changing the email or
        password requires current_password; a password change also revokes all existing
        sessions and returns a new token pair.
      parameters:
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/data.UserResponse'
        "400":
          description: Validation error, no update fields, or missing current password
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "401":
          description: Unauthorized or current password incorrect
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: User profile not found
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "409":
          description: Username or email is already registered
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile. Changing the email or
        password requires current_password; a password change also revokes all existing
        sessions and returns a new token pair.
      parameters:
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/data.UserResponse'
        "400":
          description: Validation error, no update fields, or missing current password
          schema:
            $ref: '#/definitions/data.ValidationErrorResponse'
        "401":
          description: Unauthorized or current password incorrect
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "404":
          description: User profile not found
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "409":
          description: Username or email is already registered
          schema:
            $ref: '#/definitions/data.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/data.MessageResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
